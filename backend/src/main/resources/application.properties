spring.application.name=carescribe

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/carescribe}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:SuperSecretKeyForCareScribeAIWhichIsAtLeast32BytesLong123}
jwt.access-token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:86400000}

# Server port
server.port=8080

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.carescribe=DEBUG

version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: carescribe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/carescribe
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"

volumes:
  postgres_data:
